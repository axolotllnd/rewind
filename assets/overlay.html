<!doctype html><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; media-src 'self'"><title>REWIND Overlay</title><style>
   :root{--bg:#111111f5;--text:#f6f4ee;--accent:#e6d7bd}body{margin:0;overflow:hidden;font:16px 'Segoe UI',sans-serif;color:var(--text)}body.light{--bg:#f6f4eef8;--text:#242420;--accent:#aa9168}.notice{margin:16px;display:flex;align-items:center;height:100px;background:var(--bg);border:1px solid #8883;border-radius:8px;transform:translateX(115%);opacity:0;transition:transform 420ms cubic-bezier(.22,1,.36,1),opacity 240ms ease-out}.notice.visible{transform:translateX(0);opacity:1}.glow .notice{box-shadow:0 0 14px #e6d7bd36,0 6px 16px #0004}.rail{width:4px;height:56px;background:var(--accent);border-radius:0 3px 3px 0;flex-shrink:0}.mark{margin:0 22px;width:43px;height:43px}.mark{mask:url(mark.svg) center / contain no-repeat;background:var(--accent);flex-shrink:0}strong{font-weight:500;font-size:17px}.detail{font-size:11px;opacity:.72;margin-top:7px;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}@media(prefers-reduced-motion:reduce){.notice{transform:none;transition:opacity 120ms}}
   </style><div class="notice"><span class="rail"></span><span class="mark"></span><div><strong></strong><div class="detail"></div></div></div><script src="overlay.js"></script><script src="sound-player.js"></script>
